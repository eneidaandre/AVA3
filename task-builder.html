<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVA3 • Construtor de Tarefas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <link rel="stylesheet" href="./assets/css/chrome.css">
    <link rel="stylesheet" href="./assets/css/admin.css">
    
    <style>
        /* Estilos Específicos do Construtor */
        .task-item-card { transition: all 0.2s; border-left: 4px solid transparent; }
        .task-item-card.border-type-text { border-left-color: var(--bs-primary); }
        .task-item-card.border-type-link { border-left-color: var(--bs-info); }

        .rich-editor-container { border: 1px solid #dee2e6; border-radius: 6px; overflow: hidden; background: #fff; }
        .rich-toolbar { background: #f8f9fa; padding: 5px; border-bottom: 1px solid #dee2e6; display: flex; gap: 4px; flex-wrap: wrap; }
        .rich-btn { border: 1px solid transparent; background: transparent; padding: 2px 6px; border-radius: 4px; cursor: pointer; color: #495057; }
        .rich-btn:hover { background: #e9ecef; border-color: #ced4da; }
        .rich-content { min-height: 80px; padding: 10px; outline: none; }
        .vr-sep { width: 1px; background: #ced4da; margin: 0 4px; }
    </style>
</head>

<body>

    <div id="site-header"></div>
    <div id="site-sidebar"></div>

    <main class="page-content">
        <div class="container-fluid py-4">
            
            <div class="d-flex align-items-center gap-3 mb-4">
                <button id="btn-back" class="btn btn-white border shadow-sm rounded-circle p-2">
                    <i class='bx bx-arrow-back fs-4'></i>
                </button>
                <div class="flex-grow-1">
                    <h6 class="text-muted fw-bold mb-0 small" id="task-hierarchy">Carregando...</h6>
                    <h3 class="fw-bold text-dark mb-0" id="task-title">...</h3>
                </div>
                
                <div class="text-end bg-white px-3 py-2 rounded border border-2">
                    <small class="text-muted fw-bold d-block" style="font-size:0.7rem;">TOTAL</small>
                    <span class="fw-bold fs-5 text-primary" id="total-points-display">0</span> pts
                </div>

                <button class="btn btn-success fw-bold px-4 shadow-sm" id="btn-save-top" onclick="saveTask()">
                    <i class='bx bx-save'></i> SALVAR
                </button>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-10">
                    
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body">
                            <h6 class="fw-bold text-muted mb-2"><i class='bx bx-info-circle'></i> INSTRUÇÕES GERAIS</h6>
                            <textarea id="task-instructions" class="form-control bg-light" rows="3" placeholder="Ex: Leia o texto em anexo e responda as questões abaixo..."></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h6 class="fw-bold text-muted m-0">QUESTÕES & ITENS</h6>
                        <span class="badge bg-secondary" id="items-count">0 itens</span>
                    </div>

                    <div id="task-list" class="d-flex flex-column gap-3 mb-5"></div>

                    <div class="card border-2 border-dashed bg-transparent p-4 text-center">
                        <p class="text-muted small fw-bold text-uppercase mb-3">Adicionar Nova Questão</p>
                        <div class="d-flex justify-content-center gap-3">
                            
                            <button class="btn btn-white border shadow-sm px-4 py-3 d-flex align-items-center gap-2" onclick="addTaskItem('text')">
                                <i class='bx bx-paragraph fs-3 text-primary'></i>
                                <div class="text-start">
                                    <div class="fw-bold">Dissertativa</div>
                                    <small class="text-muted" style="font-size:0.7rem;">Texto Livre</small>
                                </div>
                            </button>

                            <button class="btn btn-white border shadow-sm px-4 py-3 d-flex align-items-center gap-2" onclick="addTaskItem('link')">
                                <i class='bx bx-link fs-3 text-info'></i>
                                <div class="text-start">
                                    <div class="fw-bold">Envio de Link</div>
                                    <small class="text-muted" style="font-size:0.7rem;">Drive, Youtube...</small>
                                </div>
                            </button>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <template id="tpl-task-item">
        <div class="card task-item-card shadow-sm">
            <div class="card-header bg-white py-2 px-3 border-bottom d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <div class="btn-group">
                        <button class="btn btn-sm btn-light border btn-move-up" title="Subir"><i class='bx bx-chevron-up'></i></button>
                        <button class="btn btn-sm btn-light border btn-move-down" title="Descer"><i class='bx bx-chevron-down'></i></button>
                    </div>
                    <span class="badge bg-dark item-number">#1</span>
                    <span class="fw-bold small item-type-label ms-2">TIPO</span>
                </div>
                
                <div class="d-flex align-items-center gap-2">
                    <div class="input-group input-group-sm" style="width: 100px;">
                        <span class="input-group-text">Pts</span>
                        <input type="number" class="form-control text-center fw-bold item-points" min="0" value="0">
                    </div>
                    <button class="btn btn-sm btn-outline-danger border-0 btn-delete"><i class='bx bx-trash'></i></button>
                </div>
            </div>

            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">ENUNCIADO DA QUESTÃO</label>
                    <div class="rich-editor-container">
                        <div class="rich-toolbar">
                            <button class="rich-btn" data-cmd="bold" title="Negrito"><b>B</b></button>
                            <button class="rich-btn" data-cmd="italic" title="Itálico"><i>I</i></button>
                            <button class="rich-btn" data-cmd="underline" title="Sublinhado"><u>U</u></button>
                            <div class="vr-sep"></div>
                            <button class="rich-btn" data-cmd="insertUnorderedList" title="Lista"><i class='bx bx-list-ul'></i></button>
                            <button class="rich-btn" data-cmd="createLink" title="Link"><i class='bx bx-link'></i></button>
                            <div class="vr-sep"></div>
                            
                            <label class="color-picker-wrapper rich-btn" title="Cor do Texto">
                                <i class='bx bx-font-color'></i>
                                <input type="color" data-cmd="foreColor">
                            </label>
                            
                            <div class="ms-auto">
                                <button class="rich-btn text-danger" data-cmd="removeFormat" title="Limpar"><i class='bx bx-eraser'></i></button>
                            </div>
                        </div>
                        <div class="rich-content" contenteditable="true"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted"><i class='bx bx-link'></i> MATERIAL DE APOIO (OPCIONAL)</label>
                    <input type="text" class="form-control form-control-sm item-resource" placeholder="Cole um link aqui para ajudar o aluno...">
                </div>

                <div class="p-3 bg-light rounded border border-dashed preview-area opacity-75">
                    </div>
            </div>
        </div>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module" src="./assets/js/chrome.js"></script>
    
    <script type="module" src="./assets/js/task-builder.js"></script>
</body>
</html>
